name: flagdrive

services:
  flagdrive-checker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - flagdirve-mongo
    ports:
      - 14859:8000
    environment:
      - MONGO_ENABLED=1
      - MONGO_HOST=flagdirve-mongo
      - MONGO_PORT=27017
      - MONGO_USER=flagdrive-user
      - MONGO_PASSWORD=flagdrive-password
    mem_limit: 1G
    memswap_limit: 2G
    ulimits:
      core:
        soft: 0
        hard: 0
      nproc:
        soft: 4000
        hard: 4000
  flagdirve-mongo:
    image: mongo@sha256:a706cb4e493bcd0262f345b3b0c78732ca0e54301f0d7bbe2b66f26313ce7ccb
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: flagdrive-user
      MONGO_INITDB_ROOT_PASSWORD: flagdrive-password
    mem_limit: 1G
    memswap_limit: 2G
    ulimits:
      core:
        soft: 0
        hard: 0
      nproc:
        soft: 4000
        hard: 4000

volumes:
  mongo-data: