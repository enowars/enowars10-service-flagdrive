name: flagdrive

services:
  flagdrive-checker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - flagdrive-mongo
    ports:
      - 14859:8000
    environment:
      - MONGO_ENABLED=1
      - MONGO_HOST=flagdrive-mongo
      - MONGO_PORT=27017
      - MONGO_USER=flagdrive-user
      - MONGO_PASSWORD=flagdrive-password
    mem_limit: 1G
    memswap_limit: 2G
    ulimits:
      core:
        soft: 0
        hard: 0
      nproc:
        soft: 4000
        hard: 4000
  flagdrive-mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - ./data/:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: flagdrive-user
      MONGO_INITDB_ROOT_PASSWORD: flagdrive-password
    mem_limit: 1G
    memswap_limit: 2G
    ulimits:
      core:
        soft: 0
        hard: 0
      nproc:
        soft: 4000
        hard: 4000

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1420
