name: flagdrive

services:
  flagdrive-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4859:4859"
    depends_on:
      - flagdrive-db
    volumes:
      - database:/ctf/data
    environment:
      - RUST_BACKTRACE=1
      - DATABASE_URL=postgres://flagdrive:flagdrivepassword@flagdrive-db:5432/flagdrive

  flagdrive-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flagdrive
      POSTGRES_PASSWORD: flagdrivepassword
      POSTGRES_DB: flagdrive
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  database:
  postgres-data: